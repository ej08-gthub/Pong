<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SPLIT PONG</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #080808;
  font-family: 'Orbitron', monospace;
  touch-action: none;
  user-select: none;
}

#gameCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: block;
}

/* ── MENU ── */
#menu {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 100;
}

#menu::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%,   rgba(34,197,94,0.1)  0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(249,115,22,0.1) 0%, transparent 50%),
    rgba(8,8,8,0.92);
  pointer-events: none;
}

.menu-content {
  position: relative;
  display: flex; flex-direction: column;
  align-items: center;
}

.logo {
  font-size: clamp(48px, 12vw, 88px);
  font-weight: 900;
  letter-spacing: 0.2em;
  line-height: 0.95;
  text-align: center;
  background: linear-gradient(180deg, #4ade80 0%, #a855f7 50%, #fb923c 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: glow 3s ease-in-out infinite;
  margin-bottom: 12px;
}

@keyframes glow {
  0%,100% { filter: drop-shadow(0 0 20px rgba(168,85,247,0.35)); }
  50%      { filter: drop-shadow(0 0 48px rgba(168,85,247,0.7));  }
}

.tagline {
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(9px, 2vw, 11px);
  letter-spacing: 0.4em;
  color: #3a3a3a;
  margin-bottom: 56px;
  text-transform: uppercase;
}

.mode-cards {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: min(320px, 86vw);
}

.mode-btn {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 24px;
  border-radius: 4px;
  border: 1px solid;
  background: transparent;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  text-align: left;
  position: relative;
  overflow: hidden;
}

.mode-btn::after {
  content: '';
  position: absolute; inset: 0;
  opacity: 0;
  transition: opacity 0.18s;
}

.mode-btn:hover { transform: translateY(-2px); }
.mode-btn:hover::after { opacity: 1; }
.mode-btn:active { transform: scale(0.98); }

.mode-btn.friend { border-color: rgba(34,197,94,0.35); }
.mode-btn.friend::after { background: linear-gradient(120deg, rgba(34,197,94,0.08), transparent); }
.mode-btn.friend:hover { border-color: #22c55e; box-shadow: 0 6px 28px rgba(34,197,94,0.2); }

.mode-btn.cpu { border-color: rgba(168,85,247,0.35); }
.mode-btn.cpu::after { background: linear-gradient(120deg, rgba(168,85,247,0.08), transparent); }
.mode-btn.cpu:hover { border-color: #a855f7; box-shadow: 0 6px 28px rgba(168,85,247,0.2); }

.btn-icon { font-size: 24px; flex-shrink: 0; }
.btn-info { flex: 1; }

.btn-title {
  display: block;
  font-family: 'Orbitron', monospace;
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.2em;
  margin-bottom: 3px;
}
.mode-btn.friend .btn-title { color: #4ade80; }
.mode-btn.cpu    .btn-title { color: #c084fc; }

.btn-desc {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: #444;
  letter-spacing: 0.05em;
}

.btn-chevron { color: #333; font-size: 20px; transition: transform 0.18s, color 0.18s; }
.mode-btn:hover .btn-chevron { transform: translateX(4px); color: #666; }

/* ── RESULT ── */
#result {
  position: fixed; inset: 0;
  display: none;
  flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(8,8,8,0.86);
  backdrop-filter: blur(12px);
  z-index: 100;
}
#result.show { display: flex; }

#result-winner {
  font-size: clamp(26px, 7vw, 56px);
  font-weight: 900;
  letter-spacing: 0.18em;
  text-align: center;
  margin-bottom: 6px;
}

#result-score {
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(11px, 2.5vw, 15px);
  color: #555;
  letter-spacing: 0.25em;
  margin-bottom: 50px;
}

.res-btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

.res-btn {
  font-family: 'Orbitron', monospace;
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.2em;
  padding: 13px 28px;
  border-radius: 2px;
  border: 1px solid;
  background: transparent;
  cursor: pointer;
  transition: all 0.18s;
  text-transform: uppercase;
}
.res-btn.again   { border-color: #a855f7; color: #c084fc; }
.res-btn.again:hover   { background: rgba(168,85,247,0.12); box-shadow: 0 0 18px rgba(168,85,247,0.25); }
.res-btn.to-menu { border-color: #2a2a2a; color: #555; }
.res-btn.to-menu:hover { border-color: #444; color: #888; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="menu">
  <div class="menu-content">
    <div class="logo">SPLIT<br>PONG</div>
    <div class="tagline">Best of 5 · One Ball · Two Edges</div>
    <div class="mode-cards">
      <button class="mode-btn friend" id="btnFriend">
        <span class="btn-icon">🤝</span>
        <span class="btn-info">
          <span class="btn-title">VS FRIEND</span>
          <span class="btn-desc">P1 top edge · P2 bottom edge</span>
        </span>
        <span class="btn-chevron">›</span>
      </button>
      <button class="mode-btn cpu" id="btnCPU">
        <span class="btn-icon">🤖</span>
        <span class="btn-info">
          <span class="btn-title">VS COMPUTER</span>
          <span class="btn-desc">You're on bottom · CPU owns the top</span>
        </span>
        <span class="btn-chevron">›</span>
      </button>
    </div>
  </div>
</div>

<div id="result">
  <div id="result-winner"></div>
  <div id="result-score"></div>
  <div class="res-btns">
    <button class="res-btn again"   id="btnAgain">Play Again</button>
    <button class="res-btn to-menu" id="btnMenu">Menu</button>
  </div>
</div>

<script>
// ═══════════════════════════════════
// CONFIG
// ═══════════════════════════════════
const WIN         = 3;
const PAD_H       = 13;
const PAD_MARGIN  = 10;   // px from screen edge
const PAD_W_R     = 0.22; // fraction of screen width
const BALL_R      = 9;
const BASE_SPD_R  = 0.006; // fraction of H
const MAX_SPD_R   = 0.016;
const CPU_EASE    = 0.07;

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
let W, H, mode = 'friend', running = false;
let score = { p1: 0, p2: 0 };
let p1 = { x: 0, w: 0, dir: 0 };  // TOP paddle
let p2 = { x: 0, w: 0, dir: 0 };  // BOTTOM paddle
let ball = { x: 0, y: 0, vx: 0, vy: 0 };
let flash = { p1: 0, p2: 0 };
let t1 = {}, t2 = {};

// ═══════════════════════════════════
// CANVAS
// ═══════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  p1.w = p2.w = W * PAD_W_R;
  p1.x = clamp(p1.x, 0, W - p1.w);
  p2.x = clamp(p2.x, 0, W - p2.w);
}
window.addEventListener('resize', () => { resize(); if (!running) drawIdle(); });
resize();

// ═══════════════════════════════════
// MENU / RESULT DOM
// ═══════════════════════════════════
const menuEl   = document.getElementById('menu');
const resultEl = document.getElementById('result');

document.getElementById('btnFriend').addEventListener('click', () => startGame('friend'));
document.getElementById('btnCPU').addEventListener('click',    () => startGame('cpu'));
document.getElementById('btnAgain').addEventListener('click',  () => { resultEl.classList.remove('show'); startRound(); });
document.getElementById('btnMenu').addEventListener('click',   () => { resultEl.classList.remove('show'); showMenu(); });

function showMenu() {
  running = false;
  menuEl.style.display = 'flex';
  drawIdle();
}

function startGame(m) {
  mode = m;
  menuEl.style.display = 'none';
  score.p1 = 0; score.p2 = 0;
  startRound();
}

function startRound() {
  p1.x = W / 2 - p1.w / 2;
  p2.x = W / 2 - p2.w / 2;
  resetBall();
  running = true;
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════
// BALL RESET
// ═══════════════════════════════════
function resetBall() {
  ball.x = W / 2;
  ball.y = H / 2;
  const spd = H * BASE_SPD_R;
  const ang = (Math.random() * 50 - 25) * Math.PI / 180;
  ball.vx = spd * Math.sin(ang) * (Math.random() < 0.5 ? 1 : -1);
  ball.vy = spd * Math.cos(ang) * (Math.random() < 0.5 ? 1 : -1);
  // Make sure vy is strong enough to not be mostly horizontal
  if (Math.abs(ball.vy) < spd * 0.5) ball.vy = spd * 0.5 * Math.sign(ball.vy || 1);
}

// ═══════════════════════════════════
// INPUT — touch
// ═══════════════════════════════════
function tapDir(clientX) { return clientX < W / 2 ? -1 : 1; }

canvas.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    if (t.clientY < H / 2) {
      if (mode !== 'cpu') { t1[t.identifier] = tapDir(t.clientX); refreshDir(p1, t1); }
    } else {
      t2[t.identifier] = tapDir(t.clientX); refreshDir(p2, t2);
    }
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t1[t.identifier] !== undefined) { t1[t.identifier] = tapDir(t.clientX); refreshDir(p1, t1); }
    if (t2[t.identifier] !== undefined) { t2[t.identifier] = tapDir(t.clientX); refreshDir(p2, t2); }
  }
}, { passive: true });

canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) { delete t1[t.identifier]; delete t2[t.identifier]; }
  refreshDir(p1, t1); refreshDir(p2, t2);
}, { passive: true });

function refreshDir(pad, touches) {
  const ids = Object.keys(touches);
  pad.dir = ids.length ? touches[ids[ids.length - 1]] : 0;
}

// INPUT — mouse (desktop)
let mDown = false;
canvas.addEventListener('mousedown', e => {
  mDown = true;
  const d = tapDir(e.clientX);
  if (e.clientY < H / 2) { if (mode !== 'cpu') p1.dir = d; }
  else p2.dir = d;
});
canvas.addEventListener('mousemove', e => {
  if (!mDown) return;
  const d = tapDir(e.clientX);
  if (e.clientY < H / 2) { if (mode !== 'cpu') p1.dir = d; }
  else p2.dir = d;
});
canvas.addEventListener('mouseup',    () => { mDown = false; p1.dir = 0; p2.dir = 0; });
canvas.addEventListener('mouseleave', () => { mDown = false; p1.dir = 0; p2.dir = 0; });

// INPUT — keyboard
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup',   e => { keys[e.key] = false; });

// ═══════════════════════════════════
// CPU AI
// ═══════════════════════════════════
function tickCPU() {
  if (mode !== 'cpu') return;
  const center = p1.x + p1.w / 2;
  const diff   = ball.x - center;
  const react  = ball.vy < 0 ? 1.0 : 0.28;
  const maxSpd = W * 0.013;
  p1.x = clamp(p1.x + Math.sign(diff) * Math.min(Math.abs(diff) * CPU_EASE * react, maxSpd), 0, W - p1.w);
}

// ═══════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════
function loop() {
  if (!running) return;

  // Keyboard for P1 (A/D) and P2 (arrow keys)
  if (mode !== 'cpu') {
    if (keys['a'] || keys['A'])      p1.dir = -1;
    else if (keys['d'] || keys['D']) p1.dir =  1;
    else if (!Object.keys(t1).length) p1.dir = 0;
  }
  if (keys['ArrowLeft'])              p2.dir = -1;
  else if (keys['ArrowRight'])        p2.dir =  1;
  else if (!Object.keys(t2).length)   p2.dir =  0;

  const padSpd = W * 0.013;
  tickCPU();
  p1.x = clamp(p1.x + p1.dir * padSpd, 0, W - p1.w);
  p2.x = clamp(p2.x + p2.dir * padSpd, 0, W - p2.w);

  // Move ball
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Side wall bounce
  if (ball.x - BALL_R < 0)  { ball.x = BALL_R;     ball.vx =  Math.abs(ball.vx); }
  if (ball.x + BALL_R > W)   { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }

  // ── P1 paddle at TOP edge (vy going negative = upward toward P1) ──
  const p1Top = PAD_MARGIN;              // top of p1 paddle
  const p1Bot = PAD_MARGIN + PAD_H;     // bottom of p1 paddle
  if (ball.vy < 0
    && ball.y - BALL_R <= p1Bot
    && ball.y            >= p1Top
    && ball.x >= p1.x - 4 && ball.x <= p1.x + p1.w + 4) {
    ball.y = p1Bot + BALL_R;
    bounceOff(p1, 1);  // send ball downward
  }

  // ── P2 paddle at BOTTOM edge (vy going positive = downward toward P2) ──
  const p2Top = H - PAD_MARGIN - PAD_H; // top of p2 paddle
  const p2Bot = H - PAD_MARGIN;         // bottom of p2 paddle
  if (ball.vy > 0
    && ball.y + BALL_R >= p2Top
    && ball.y            <= p2Bot
    && ball.x >= p2.x - 4 && ball.x <= p2.x + p2.w + 4) {
    ball.y = p2Top - BALL_R;
    bounceOff(p2, -1); // send ball upward
  }

  // ── Scoring ──
  if (ball.y + BALL_R > H) {
    // Ball exits bottom → P1 scores
    score.p1++; flash.p1 = 20;
    if (checkWin()) return;
    resetBall();
  }
  if (ball.y - BALL_R < 0) {
    // Ball exits top → P2 scores
    score.p2++; flash.p2 = 20;
    if (checkWin()) return;
    resetBall();
  }

  if (flash.p1 > 0) flash.p1--;
  if (flash.p2 > 0) flash.p2--;

  draw();
  requestAnimationFrame(loop);
}

function bounceOff(pad, yDir) {
  const hit = (ball.x - (pad.x + pad.w / 2)) / (pad.w / 2);
  const spd = Math.min(Math.hypot(ball.vx, ball.vy) * 1.045, H * MAX_SPD_R);
  const ang = hit * 65 * Math.PI / 180;
  ball.vx   = spd * Math.sin(ang);
  ball.vy   = Math.max(Math.abs(spd * Math.cos(ang)), H * 0.003) * yDir;
}

function checkWin() {
  if (score.p1 < WIN && score.p2 < WIN) return false;
  running = false;
  const p1won = score.p1 >= WIN;
  let name, color;
  if (mode === 'cpu') {
    name  = p1won ? 'CPU WINS' : 'YOU WIN!';
    color = p1won ? '#a855f7' : '#fb923c';
  } else {
    name  = p1won ? 'PLAYER 1 WINS' : 'PLAYER 2 WINS';
    color = p1won ? '#4ade80' : '#fb923c';
  }
  document.getElementById('result-winner').innerHTML =
    `<span style="color:${color};text-shadow:0 0 30px ${color}66">${name}</span>`;
  document.getElementById('result-score').textContent = `${score.p1} – ${score.p2}`;
  resultEl.classList.add('show');
  return true;
}

// ═══════════════════════════════════
// DRAW
// ═══════════════════════════════════
function draw() {
  // Backgrounds — top half green, bottom half orange
  ctx.fillStyle = '#071a0d'; ctx.fillRect(0, 0, W, H / 2);
  ctx.fillStyle = '#1a0800'; ctx.fillRect(0, H / 2, W, H / 2);

  drawGrid(0,    H/2, 'rgba(34,197,94,0.04)');
  drawGrid(H/2,  H/2, 'rgba(249,115,22,0.04)');

  // Score-flash tints
  if (flash.p1 > 0) {
    ctx.fillStyle = `rgba(34,197,94,${(flash.p1/20)*0.2})`;
    ctx.fillRect(0, 0, W, H/2);
  }
  if (flash.p2 > 0) {
    ctx.fillStyle = `rgba(249,115,22,${(flash.p2/20)*0.2})`;
    ctx.fillRect(0, H/2, W, H/2);
  }

  // Centre divider dashes
  ctx.save();
  ctx.strokeStyle = 'rgba(168,85,247,0.22)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([14, 22]);
  ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2);
  ctx.stroke();
  ctx.restore();

  // Score pips
  drawPips(score.p1, W/2, H/2 - 24, '#4ade80');
  drawPips(score.p2, W/2, H/2 + 24, '#fb923c');

  // Labels
  label(W/2, H/2 - 44, mode === 'cpu' ? 'COMPUTER' : 'PLAYER 1', 'rgba(74,222,128,0.3)');
  label(W/2, H/2 + 58, mode === 'cpu' ? 'YOU'       : 'PLAYER 2', 'rgba(251,146,60,0.3)');

  // Tap hints (near paddles)
  hint(W/2, PAD_MARGIN + PAD_H + 22, 'rgba(74,222,128,0.2)');
  hint(W/2, H - PAD_MARGIN - PAD_H - 12, 'rgba(251,146,60,0.2)');

  // Paddles
  drawPaddle(p1.x, PAD_MARGIN, p1.w, '#22c55e', '#4ade80');
  drawPaddle(p2.x, H - PAD_MARGIN - PAD_H, p2.w, '#f97316', '#fb923c');

  // Ball
  drawBall(ball.x, ball.y);
}

function drawIdle() {
  ctx.fillStyle = '#071a0d'; ctx.fillRect(0, 0, W, H/2);
  ctx.fillStyle = '#1a0800'; ctx.fillRect(0, H/2, W, H/2);
  ctx.save();
  ctx.strokeStyle = 'rgba(168,85,247,0.22)'; ctx.lineWidth = 1.5; ctx.setLineDash([14,22]);
  ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
  ctx.restore();
  const pw = W * PAD_W_R;
  drawPaddle(W/2 - pw/2, PAD_MARGIN, pw, '#22c55e', '#4ade80');
  drawPaddle(W/2 - pw/2, H - PAD_MARGIN - PAD_H, pw, '#f97316', '#fb923c');
  drawBall(W/2, H/2);
}

function drawGrid(offsetY, height, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 1;
  const s = 48;
  for (let x = 0; x < W; x += s) {
    ctx.beginPath(); ctx.moveTo(x, offsetY); ctx.lineTo(x, offsetY + height); ctx.stroke();
  }
  for (let y = offsetY; y < offsetY + height; y += s) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
}

function drawPips(n, cx, cy, color) {
  const gap = 18, r = 5.5;
  const sx = cx - ((WIN - 1) * gap) / 2;
  for (let i = 0; i < WIN; i++) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(sx + i * gap, cy, r, 0, Math.PI * 2);
    if (i < n) {
      ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 12; ctx.fill();
    } else {
      ctx.strokeStyle = color; ctx.globalAlpha = 0.3; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.restore();
  }
}

function label(cx, cy, text, color) {
  ctx.save();
  ctx.font = 'bold 9px Orbitron, monospace';
  ctx.textAlign = 'center'; ctx.fillStyle = color;
  ctx.fillText(text, cx, cy);
  ctx.restore();
}

function hint(cx, cy, color) {
  ctx.save();
  ctx.font = '9px "Share Tech Mono", monospace';
  ctx.textAlign = 'center'; ctx.fillStyle = color;
  ctx.fillText('◀ TAP LEFT   TAP RIGHT ▶', cx, cy);
  ctx.restore();
}

function drawPaddle(x, y, w, fill, glow) {
  const r = PAD_H / 2;
  ctx.save();
  ctx.shadowColor = glow; ctx.shadowBlur = 22;
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, -Math.PI/2, Math.PI/2);
  ctx.lineTo(x + r, y + PAD_H);
  ctx.arc(x + r, y + r, r, Math.PI/2, -Math.PI/2);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(x + r, y + 2, w - r * 2, 3);
  ctx.restore();
}

function drawBall(x, y) {
  ctx.save();
  ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 30;
  const g = ctx.createRadialGradient(x - 2.5, y - 2.5, 0.5, x, y, BALL_R);
  g.addColorStop(0,    '#f0e6ff');
  g.addColorStop(0.35, '#c084fc');
  g.addColorStop(0.75, '#a855f7');
  g.addColorStop(1,    '#581c87');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, BALL_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
p1.x = p2.x = W / 2 - (W * PAD_W_R) / 2;
ball.x = W / 2; ball.y = H / 2;
drawIdle();
</script>
</body>
</html>
